[project]
name = "backend"
version = "0.1.0"
description = "PULSE Competitive Landscape — API, cleaning pipeline, AI enrichment, research agent"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.109.1",
    "fastapi>=0.137.1",
    "httpx>=0.28.1",
    "pydantic>=2",
    "pydantic-settings>=2.14.1",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
